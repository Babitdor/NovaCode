<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-a: #0b0f1a;
      --bg-b: #131a33;
      --bg-c: #1d1035;
      --ink: #eaf0ff;
      --accent: #7ee0ff;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%);
      background-size: 200% 200%;
      animation: drift 18s ease-in-out infinite;
      color: var(--ink);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, rgba(126, 224, 255, 0.14), transparent 60%);
    }

    h1 {
      position: relative;
      margin: 0;
      padding: 0 1.5rem;
      font-size: clamp(2.75rem, 12vw, 8rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      text-align: center;
      background: linear-gradient(90deg, #ffffff 0%, var(--accent) 50%, #b48bff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rise 900ms cubic-bezier(0.22, 1, 0.36, 1) both,
                 float 6s ease-in-out 900ms infinite;
    }

    h1::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -0.55rem;
      width: 3.5rem;
      height: 2px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.8;
    }

    @keyframes drift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(1.25rem); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { translate: 0 0; }
      50%      { translate: 0 -0.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      body, h1, h1::after { animation: none; }
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
</body>
</html>
