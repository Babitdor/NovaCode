[package]
name = "nova-tui"
description = "Ratatui client for NovaCode: a frontend for the Nova TUI server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nova_tui"
path = "src/lib.rs"

[[bin]]
name = "nova-tui"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29.0", features = ["osc52"] }
pulldown-cmark = "0.13.6"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"
