          - heading "The same rules apply inside" [level=3] [ref=e301]
          - paragraph [ref=e302]: Nested calls go through the configured tool inventory, argument validation, middleware and approval decisions, exactly as direct calls do. Memory, code size, run time, call count and concurrency are all bounded, and interrupting the script cancels pending work.
