services:
  # ── Ollama (LLM backend for the async agents) ─────────────────────────────
  ollama:
    image: ollama/ollama:latest
    # No host port publish: langgraph reaches it in-network at ollama:11434, and
    # publishing 11434 collides with a host Ollama if one is already running.
    # Add a `ports: ["11435:11434"]` mapping only if you need host access.
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── LangGraph server (hosts ALL async agent graphs) ───────────────────────
  # A single server serves every graph registered in langgraph.json
  # (documentation-update / code-review / test-generation / dependency-audit /
  # refactoring). Clients pick one by graph_id, so there is no need for a server
  # per agent — the NOVA CLI reaches them all at ASYNC_AGENT_BASE_URL:2024.
  langgraph:
    build: .
    ports:
      - "2024:2024"
    environment:
      # The async-agent graphs build their model from ASYNC_AGENT_PROVIDER +
      # ASYNC_AGENT_MODEL, delegating to Nova's shared model constructor. Ollama
      # is the default: for it, OLLAMA_HOST/OLLAMA_BASE_URL below point the client
      # at the host Ollama (models + cloud auth), or at the bundled container.
      # For any other provider, set the vars below (and its API key) here, since
      # compose forwards only what is listed.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_BASE_URL=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - DOC_AGENT_MODEL=${DOC_AGENT_MODEL:-gemma4:31b-cloud}
      - ASYNC_AGENT_PROVIDER=${ASYNC_AGENT_PROVIDER:-ollama}
      - ASYNC_AGENT_MODEL=${ASYNC_AGENT_MODEL:-}
      - PLAN_SCOUT_MODEL=${PLAN_SCOUT_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - LANGGRAPH_API_KEY=${LANGGRAPH_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/.venv  # keep the image's venv (has langgraph-cli) behind the mount
    depends_on:
      ollama:
        condition: service_healthy
    # langgraph.json references .env; ensure it exists (seed from .env.example)
    # before starting so the dev server boots even on a fresh checkout.
    command: sh -c "[ -f .env ] || cp .env.example .env; uv run --no-sync langgraph dev --host 0.0.0.0 --port 2024"
    restart: unless-stopped

volumes:
  ollama_data:
