[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "novacode-cli"
version = "1.0.28"
description = "Agentic Coding Tool that runs in your terminal"
authors = [{ name = "Babitdor", email = "babitdorbryan14@gmail.com" }]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
keywords = ["nova", "code-cli", "nova-code", "agentic-code-cli"]

requires-python = ">=3.11,<4.0"
classifiers = [
     "Development Status :: 3 - Alpha",
     "Intended Audience :: Developers",
     "Programming Language :: Python :: 3.11",
     "Programming Language :: Python :: 3.12",                                                           
     "Programming Language :: Python :: 3.13",
     "Framework :: LangChain-DeepAgents",
 ]
dependencies = [
    "requests",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "textual>=1.0.0",
    # LangChain ecosystem (updated 2025-01)
    "langchain>=1.2.13",
    "langchain-core>=1.2.22",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.4.0",
    "langchain-ollama>=1.0.1",
    "langchain-google-genai>=4.2.1",
    "google-auth>=2.40",
    "google-auth-oauthlib>=1.2.2",
    "langchain-nvidia-ai-endpoints>=1.4.1",
    "langchain-mcp-adapters>=0.2.2",
    "langgraph>=1.1.3",
    # Provides langgraph.store.sqlite.SqliteStore + the SQLite checkpointer.
    # Optional at runtime (memory falls back to a stdlib-sqlite3 store) but
    # declared so a normal install gets the preferred, battle-tested backend.
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langsmith>=0.7.22",
    # Other dependencies
    "tavily-python",
    # 0.7.x: verified against Nova's three monkey-patches into deepagents
    # internals (validate_path, perform_string_replacement, create_sub_agent) —
    # all three keep the same signatures through 0.7.9. Capped below 0.8 because
    # those patches bind private internals a minor bump may reshape;
    # tests/test_deepagents_compat.py fails loudly if one drifts.
    "deepagents>=0.7.0,<0.8",
    "python-dotenv",
    "daytona>=0.113.0",
    "modal>=0.65.0",
    "markdownify>=0.13.0",
    "runloop-api-client>=0.69.0",
    "mcp>=1.28.1,<2",
    "docker>=7.0.0",
    "keyring>=24.0.0",
    "pillow",
    "aiosqlite>=0.19.0",
    # Format conversion and code formatting tools
    "pyyaml>=6.0",
    "tomli-w>=1.0.0",
    # Web search (no API key required)
    "ddgs>=7.0.0",
    # Imported directly by Nova. They used to arrive only as somebody else's
    # dependency (pymupdf solely through browser-use), which is not a promise.
    "aiohttp>=3.9",
    "httpx>=0.27",
    # Verify OIDC ID-token signatures against OpenAI's JWKS for Sign in with ChatGPT.
    "PyJWT[crypto]>=2.10",
    "pydantic>=2.0",
    "pymupdf>=1.24",   # PDF text extraction (read_file on a .pdf)
    "bm25s>=0.2",      # skill retrieval; came in through semble until semble dropped it
    "graphifyy>=0.4.0",
    "semble>=0.1.8",
    "discord.py>=2.3.0",
    "python-telegram-bot>=21.0.0",
    "langchain-quickjs>=0.2.0",
    # Persistent Python kernel snapshots (pickle superset: lambdas, classes).
    "dill>=0.3.8",
    # TypeSafe classifier for /router. Pre-1.0 (0.0.1a3): only the stable
    # `TypeSafeClassifier` is used, never `langchain_typesafe.experimental`.
    "langchain-typesafe>=0.0.1a3",
]

[project.optional-dependencies]
# Real-browser automation: the /browser-use command and the LinkedIn scraper.
# Kept out of the base install because it is ~330 MB (playwright, patchright,
# google-api-python-client) for two features most sessions never touch; the
# browser-automation-agent drives a browser through the Playwright MCP server,
# which is an npm package and does not need this.
#   uv tool install "novacode-cli[browser] @ git+https://github.com/Babitdor/NovaCode.git"
#   uv sync --extra browser
browser = [
    "browser-use>=0.1.0",
    "playwright>=1.40.0",
]
voice = [
    "faster-whisper>=1.0.0",   # STT
    "silero-vad>=5.1",         # VAD (utterance endpointing)
    "piper-tts>=1.2.0",        # TTS
    "sounddevice>=0.4.6",      # microphone capture + playback
]
# Optional, heavy: Orpheus LLM-based TTS (CPU via llama.cpp). Opt-in — kept out
# of [voice] because it pulls a ~2GB model. orpheus-cpp imports llama-cpp-python
# at runtime but does NOT declare it as a dependency, so we add it here; it's
# pinned to the prebuilt CPU wheel index below (no compiler needed).
voice-orpheus = [
    "orpheus-cpp>=0.0.3",
    "llama-cpp-python>=0.3.0",
]
# Optional STT: NVIDIA Parakeet via sherpa-onnx (CPU/CUDA). Opt-in — the model
# downloads on first use. Select with /voice settings stt parakeet.
voice-parakeet = [
    "sherpa-onnx>=1.10.0",
]
# Optional TTS: Kyutai Pocket-TTS (CPU). Opt-in — the model downloads on
# first use. Select with /voice settings tts pocket.
voice-pocket = [
    "pocket-tts>=0.1.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]
# Optional: lets Nova launch its own `langgraph dev` server for the async
# (remote) subagents, instead of requiring the Docker container. Deliberately
# NOT a core dependency, matching the Dockerfile, which installs the same thing
# on top of the frozen sync. Pulls langgraph-api, so it is opt-in:
#   uv sync --extra agents-server
agents-server = [
    "langgraph-cli[inmem]",
]

[project.urls]
    Homepage = "https://github.com/Babitdor/NovaCode"
    Repository = "https://github.com/Babitdor/NovaCode"
    Issues = "https://github.com/Babitdor/NovaCode/issues"
    Changelog = "https://github.com/Babitdor/NovaCode/blob/main/CHANGELOG.md"

[project.scripts]
nova = "novacode_cli.entrypoint:cli_main"

# llama-cpp-python (used by the optional [voice-orpheus] extra) ships only an
# sdist on PyPI — installing it from there needs a C++ toolchain. The abetlen
# index serves prebuilt CPU wheels for Windows/Linux/macOS. The named index +
# explicit source below makes uv fetch llama-cpp-python ONLY from there, while
# every other package still resolves from PyPI.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[tool.setuptools.package-data]
"*" = ["*.jinja", "langgraph.json"]
novacode_cli = ["assets/Nova.png"]

[tool.ruff]
line-length = 100
exclude = []

[tool.ruff.format]
docstring-code-format = true  # Formats code blocks in docstrings

[tool.ruff.lint]
select = [
    "ALL"  # Enable all rules by default
]
ignore = [
    "COM812",  # Messes with the formatter
    "ISC001",  # Messes with the formatter
    "PERF203", # Rarely useful
    "SLF001",  # Private member access
    "PLC0415", # Imports should be at the top. Not always desirable
    "PLR0913", # Too many arguments in function definition
    "PLC0414", # Inconsistent with how type checkers expect to be notified of intentional re-exports
    "C901",    # Too complex
]
unfixable = ["B028"]  # Rules that shouldn't be auto-fixed

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"  # Google-style docstrings
ignore-var-parameters = true

[tool.ruff.lint.per-file-ignores]
"novacode_cli/cli.py" = [
    "T201",    # Allow print statements in CLI
]
"novacode_cli/headless/*" = [
    "ANN001",  # agent/session_state/backend are untyped framework objects (matches ui/execution.py)
    "ANN401",  # event/obj are deliberately Any for event-stream dispatch (matches ui_events.py)
]
"novacode_cli/tools.py" = [
    "PLR0912", # Too many branches - @tool decorated functions can't be easily refactored
    "PLR0915", # Too many statements - @tool decorated functions can't be easily refactored
    "PLR0911", # Too many return statements - @tool decorated functions can't be easily refactored
    "PLW0603", # Global statement for session caching - intentional pattern
    "FBT001",  # Boolean args in @tool decorated functions
    "FBT002",  # Boolean default args in @tool decorated functions
    "S603",    # subprocess call check - intentional for linting/type-checking tools
    "S607",    # Partial executable path - intentional for external tool calls
    "S311",    # Pseudo-random for User-Agent rotation - not security sensitive
    "PLR2004", # Magic values - HTTP status codes and timeouts
    "ANN",     # Annotation rules - many functions intentionally lack annotations
    "TRY300",  # Consider else - structural pattern in error handling
    "PERF401", # List comprehension - performance hint not applicable
    "SIM105",  # contextlib.suppress - try/except is clearer here
    "PGH003",  # Specific type ignore codes - not critical
    "E402",    # Module level import not at top - conditional imports for optional deps
]
"tests/*" = [
    "D1",      # Skip documentation rules in tests
    "S101",    # Allow asserts in tests
    "S311",    # Allow pseudo-random generators in tests
    "ANN201",  # Missing return type annotation
    "INP001",  # Implicit namespace package
    "PLR2004", # Magic value comparisons are fine in tests
]

[tool.pytest.ini_options]
# Without this, bare `pytest` walks the whole repo — including .venv/Lib/site-packages,
# whose thousands of third-party test modules get imported until collection times out.
testpaths = ["tests"]
timeout = 10  # Default timeout for all tests (can be overridden per-test)
timeout_method = "thread"  # Forcefully interrupt hung tests on Windows
asyncio_mode = "auto"
markers = [
    # Opt out of the autouse `no_blocking_io` guard in tests/conftest.py, for a
    # test that arms its own BlockBuster and asserts on it directly.
    "own_blockbuster_guard: test arms its own blocking-I/O guard and asserts on it",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Test-only guard that fails a test when the TUI makes a blocking call on its
    # event loop. Pinned to the range the langgraph dev runtime arms, so the guard
    # and the runtime agree on what counts as blocking. Not a runtime dependency:
    # tests match the error by class name so it can be absent in production.
    "blockbuster>=1.5.26,<1.6",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
enable_error_code = ["deprecated"]
# Optional: reduce strictness if needed
disallow_any_generics = false
warn_return_any = false

[tool.setuptools.packages.find]
include = ["novacode_cli*"]
