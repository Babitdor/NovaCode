name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  UV_PYTHON: '3.11'
  DO_NOT_TRACK: '1'
  LANGSMITH_TRACING: 'false'

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Install locked runtime and test dependencies
        run: uv sync --locked --group dev
      - name: Install optional native search engines (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bfs ugrep
      - name: Require real native search coverage on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: echo "NOVA_REQUIRE_NATIVE_SEARCH=1" >> "$GITHUB_ENV"
      - name: Check release metadata and changelog
        run: >-
          uv run --no-sync python -c "import pathlib, tomllib;
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          lock = tomllib.loads(pathlib.Path('uv.lock').read_text(encoding='utf-8'));
          assert any(p['name'] == 'novacode-cli' and p['version'] == version for p in lock['package']);
          assert pathlib.Path('changelog', 'CHANGELOG-v' + version + '.md').is_file()"
      - name: Check focused tool lint
        run: >-
          uv run --no-sync ruff check --select F,I
          novacode_cli/agents/strict_tools.py
          novacode_cli/process_manager.py
          novacode_cli/computation_cache.py
          novacode_cli/memory/semantic.py
          novacode_cli/memory/parsed_cache.py
          novacode_cli/skills/retrieval.py
          novacode_cli/shell/processes.py
          novacode_cli/shell/output.py
          novacode_cli/tui/shell_output.py
          novacode_cli/remote/async_task_clients.py
          novacode_cli/remote/async_task_watcher.py
          novacode_cli/agents/async_task_errors.py
          novacode_cli/session/resume_workspace.py
          novacode_cli/tui/resume_picker.py
          novacode_cli/tools/waiter_tools.py
          scripts/benchmark_background_tasks.py
          tests/test_background_responsiveness.py
          novacode_cli/tui/icons.py
          tests/test_tui_icons.py
          novacode_cli/agents/attribution.py
          novacode_cli/plugins/claude_plugins.py
          novacode_cli/plugins/components.py
          novacode_cli/plugins/storage.py
          novacode_cli/plugins/hooks.py
          novacode_cli/plugins/cli.py
          novacode_cli/plugins/marketplaces.py
          novacode_cli/agents/ponytail.py
          novacode_cli/agents/caveman.py
          novacode_cli/agents/browser_mode.py
          novacode_cli/config/browser_mode.py
          novacode_cli/commands/browser_use_handler.py
          novacode_cli/commands/onboard_handler.py
          novacode_cli/project_onboard.py
          tests/test_project_onboard.py
          tests/test_tui_onboard_progress.py
          novacode_cli/tui/browser_settings_screen.py
          novacode_cli/agents/caveman_support.py
          novacode_cli/agents/prime.py
          novacode_cli/agents/plan_agent/plan_mode_middleware.py
          novacode_cli/config/plan_mode.py
          novacode_cli/commands/prime_handler.py
          novacode_cli/prime.py
          novacode_cli/prime_memory.py
          novacode_cli/tui/prime_panel.py
          novacode_cli/tui/caveman_screen.py
          novacode_cli/tui/diff_preview.py
          novacode_cli/core/reasoning.py
          novacode_cli/agents/tool_search_variants.py
          novacode_cli/mcp/generic.py
          novacode_cli/mcp/code_mode.py
          novacode_cli/mcp/code_runtime.py
          novacode_cli/tools/cron_tools.py
          novacode_cli/tools/inspection_tools.py
          novacode_cli/tools/notebook_tools.py
          novacode_cli/backends/native_search.py
          novacode_cli/security/delegated_approval.py
          novacode_cli/security/prompt_injection.py
          novacode_cli/teams/workspace.py
          novacode_cli/security/local_http.py
          novacode_cli/security/paths.py
          novacode_cli/utils/windows.py
          novacode_cli/security/policy.py
          novacode_cli/utils/backend_paths.py
          novacode_cli/integrations/host_path.py
          novacode_cli/path_approval.py
          novacode_cli/commands/share_handler.py
          novacode_cli/artifacts/server.py
          novacode_cli/tools/artifact_tools.py
          novacode_cli/remote/rootapp_bridge.py
          novacode_cli/remote/discord_threads.py
          novacode_cli/remote/discord_bridge.py
          novacode_cli/remote/rootapp_setup.py
          novacode_cli/commands/rootapp_remote.py
          scripts/check_caveman_style.py
          scripts/verify_prime.py
          scripts/ci_regression.py
          scripts/check_release_ci.py
          tests/test_ci_tools.py
      - name: Verify project onboarding
        run: >-
          uv run --no-sync pytest -q --tb=short
          tests/test_project_onboard.py tests/test_tui_onboard_progress.py
      - name: Verify Prime evidence boundaries
        run: uv run --no-sync python scripts/verify_prime.py --mutations
      - name: Verify native and MCP Code Mode boundaries
        run: uv run --no-sync python scripts/verify_mcp_code_mode.py
      - name: Verify approvals and background MCP startup
        run: >-
          uv run --no-sync pytest -q --tb=short --junitxml=test-results/approval-startup.xml
          tests/test_agent_stream.py
          tests/test_mcp_background.py
          tests/test_provider_cache_usage.py
          tests/test_ci_tools.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ matrix.os }}
          path: test-results/*.xml
          if-no-files-found: warn

  regression:
    name: Regression (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Install locked runtime and test dependencies
        run: uv sync --locked --group dev
      - name: Install optional native search engines (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bfs ugrep
      - name: Require real native search coverage on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: echo "NOVA_REQUIRE_NATIVE_SEARCH=1" >> "$GITHUB_ENV"
      - name: Run offline regression shard
        run: uv run --no-sync python scripts/ci_regression.py --shard ${{ matrix.shard }} --shards 4
      - name: Upload test results and log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  ci-result:
    name: CI result
    if: always()
    needs: [checks, regression, windows-install-update]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$RESULTS" = "success,success,success"

  windows-install-update:
    name: Windows install and update
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Install locked test dependencies
        run: uv sync --locked --group dev
      - name: Check updater regressions including locked launchers
        run: >-
          uv run --no-sync pytest -q --tb=short --junitxml=test-results/updater.xml
          tests/test_updates.py
          tests/test_update_release.py
          tests/test_update_restart.py
          tests/test_update_guard.py
          tests/test_windows_launcher.py
          tests/test_update_console_native.py
          tests/test_update_success_screen.py
          tests/test_tui_update_release.py
      - name: Build wheel and source distribution
        run: uv build
      - name: Isolate tool installation directories
        run: |
          "UV_TOOL_DIR=$(Join-Path $env:RUNNER_TEMP 'nova-tools')" >> $env:GITHUB_ENV
          "UV_TOOL_BIN_DIR=$(Join-Path $env:RUNNER_TEMP 'nova-bin')" >> $env:GITHUB_ENV
      - name: Install and reinstall the built wheel
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl).FullName
          if (@($wheel).Count -ne 1) { throw 'Expected exactly one wheel' }
          uv tool install --python 3.11 $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $launcher = Join-Path $env:UV_TOOL_BIN_DIR 'nova.exe'
          $toolPython = Join-Path $env:UV_TOOL_DIR 'novacode-cli/Scripts/python.exe'
          $codeModeSmoke = Join-Path $env:GITHUB_WORKSPACE 'scripts/verify_installed_code_mode.py'
          $expected = uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Run outside the checkout so source files cannot hide packaging errors.
          Push-Location $env:RUNNER_TEMP
          try {
            $output = & $launcher --version
            if ($LASTEXITCODE -ne 0) { throw 'Installed launcher failed' }
            if (($output -join "`n") -notmatch [regex]::Escape("v$expected")) {
              throw "Installed launcher did not report v$expected"
            }
            & $toolPython $codeModeSmoke
            if ($LASTEXITCODE -ne 0) { throw 'Installed Code Mode runtime failed' }
            uv tool install --python 3.11 --force --reinstall $wheel
            if ($LASTEXITCODE -ne 0) { throw 'Wheel reinstall failed' }
            $output = & $launcher --version
            if ($LASTEXITCODE -ne 0) { throw 'Reinstalled launcher failed' }
            if (($output -join "`n") -notmatch [regex]::Escape("v$expected")) {
              throw "Reinstalled launcher did not report v$expected"
            }
            & $toolPython $codeModeSmoke
            if ($LASTEXITCODE -ne 0) { throw 'Reinstalled Code Mode runtime failed' }
          } finally {
            Pop-Location
          }
      - name: Upload package and test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package-and-updater-results
          path: |
            dist/*.whl
            dist/*.tar.gz
            test-results/*.xml
          if-no-files-found: warn
