name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify release commit passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require successful CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_ci.py

  publish:
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/novacode-cli
    permissions:
      contents: read
      id-token: write
    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Validate release metadata
        id: metadata
        run: |
          uv run --no-project --with trove-classifiers python - <<'PY'
          import os
          import runpy
          import tomllib
          from pathlib import Path
          from trove_classifiers import classifiers

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = project["version"]
          assert project["name"] == "novacode-cli", "Unexpected package name"
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match package version"
          assert runpy.run_path("novacode_cli/_version.py")["__version__"] == version
          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          assert any(p["name"] == "novacode-cli" and p["version"] == version for p in lock["package"])
          assert Path("changelog", f"CHANGELOG-v{version}.md").is_file(), "Missing changelog"
          invalid = set(project.get("classifiers", [])) - classifiers
          assert not invalid, f"Invalid PyPI classifiers: {sorted(invalid)}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Build release artifacts
        run: uv build

      - name: Validate package metadata
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: uvx twine check "dist/novacode_cli-${VERSION}-py3-none-any.whl" "dist/novacode_cli-${VERSION}.tar.gz"

      - name: Publish with PyPI Trusted Publishing
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ "dist/novacode_cli-${VERSION}-py3-none-any.whl" "dist/novacode_cli-${VERSION}.tar.gz"

  binaries:
    name: TUI client (${{ matrix.platform }})
    needs: verify-ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-latest
            triple: aarch64-apple-darwin
            platform: macos-aarch64
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the wire protocol version this build speaks
        id: protocol
        shell: bash
        run: |
          version=$(grep -m1 'PROTOCOL_VERSION: u64 =' rust/nova-tui/src/frames.rs | tr -dc '0-9')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the client
        working-directory: rust
        run: cargo build --release -p nova-tui --target ${{ matrix.triple }}
      - name: Stage the artifact with its protocol stamp
        shell: bash
        env:
          PROTOCOL: ${{ steps.protocol.outputs.version }}
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          src="rust/target/${{ matrix.triple }}/release/nova-tui${suffix}"
          asset="nova-tui-p${PROTOCOL}-${{ matrix.platform }}${suffix}"
          mkdir -p dist
          cp "$src" "dist/$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Attach the binary beside the wheel
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "NovaCode $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "dist/$ASSET" --clobber

